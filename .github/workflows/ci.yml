name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Ensure Changesets base branch is available
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags origin '+refs/heads/main:refs/heads/main'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Changesets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show "$BASE_SHA:package.json" | node -e "let input = ''; process.stdin.on('data', (chunk) => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")
          if [[ "$CURRENT_VERSION" != "$BASE_VERSION" ]]; then
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA...HEAD")
            if ! grep -qx 'CHANGELOG.md' <<<"$CHANGED_FILES" || ! grep -qx 'package-lock.json' <<<"$CHANGED_FILES"; then
              echo "A version PR must update CHANGELOG.md and package-lock.json." >&2
              exit 1
            fi
            CONSUMED_CHANGESETS=$(git diff --diff-filter=D --name-only "$BASE_SHA...HEAD" -- '.changeset/*.md' | grep -viE '/README\.md$' || true)
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            HAS_PACKAGE_CHANGESET=false
            for CHANGESET_FILE in $CONSUMED_CHANGESETS; do
              if git show "$BASE_SHA:$CHANGESET_FILE" | grep -Fq "$PACKAGE_NAME"; then
                HAS_PACKAGE_CHANGESET=true
                break
              fi
            done
            if [[ "$HAS_PACKAGE_CHANGESET" != true ]]; then
              echo "A version PR must consume a pre-existing Changeset for $PACKAGE_NAME." >&2
              exit 1
            fi
            exit 0
          fi
          CHANGESET_FILES=$(git diff --diff-filter=A --name-only "$BASE_SHA...HEAD" -- '.changeset/*.md' | grep -viE '/README\.md$' || true)
          if [[ -z "$CHANGESET_FILES" ]]; then
            echo "Pull requests without a version change must add a non-README Changeset, including an empty Changeset for exempt work." >&2
            exit 1
          fi
          npm run changeset -- status
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts --json
